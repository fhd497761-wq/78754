<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://vip-8bb91-default-rtdb.firebaseio.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>VirtualFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter","Cairo",system-ui,-apple-system,sans-serif;
  --MH:min(calc(var(--vh)*78),62vw);
  --CW:200px;
  --vh:1vh;
  --garm:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261104_080719_f5a4cca2-cf42-4957-ab3b-ddec34d2b71a.png&w=2048&q=85");
}
body{background:#0a0b10;color:#fff;font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none;position:fixed;inset:0;width:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* dark animated room */
.room{position:fixed;inset:-3%;overflow:hidden;background:
  radial-gradient(90% 70% at 50% 40%,#12141d,#07080c 80%);will-change:transform}
.room i{position:absolute;border-radius:50%;will-change:transform}
.room .b1{width:62vmax;height:62vmax;left:-14%;top:-24%;background:radial-gradient(circle,rgba(70,78,190,.55),transparent 66%);animation:d1 28s ease-in-out infinite alternate}
.room .b2{width:56vmax;height:56vmax;right:-16%;top:8%;background:radial-gradient(circle,rgba(34,150,156,.42),transparent 66%);animation:d2 34s ease-in-out infinite alternate}
.room .b3{width:52vmax;height:52vmax;left:18%;bottom:-34%;background:radial-gradient(circle,rgba(176,112,52,.36),transparent 66%);animation:d3 40s ease-in-out infinite alternate}
.room .sweep{position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.05) 50%,transparent 58%);background-size:260% 100%;animation:sw 14s linear infinite}
.room .grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.room::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 65% at 50% 50%,transparent 40%,rgba(0,0,0,.55))}
@keyframes d1{to{transform:translate3d(18vmax,12vmax,0) scale(1.15)}}
@keyframes d2{to{transform:translate3d(-16vmax,14vmax,0) scale(.9)}}
@keyframes d3{to{transform:translate3d(14vmax,-12vmax,0) scale(1.2)}}
@keyframes sw{from{background-position:130% 0}to{background-position:-130% 0}}

/* ghost word */
.ghost{position:fixed;left:50%;top:calc(50% - var(--MH)*.42);transform:translate(-50%,0);z-index:2;pointer-events:none;white-space:nowrap;
  font-weight:900;font-size:calc(var(--MH)*.42);line-height:.8;letter-spacing:-.04em;
  color:rgba(255,255,255,.04);-webkit-text-stroke:1px rgba(255,255,255,.14)}
.ghost span{display:inline-block}

/* glass */
.glass{background:linear-gradient(155deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 48%,rgba(255,255,255,.09));
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 24px 60px -24px rgba(0,0,0,.7)}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--vh)*4.2);z-index:30;display:flex;gap:2px;padding:5px;border-radius:999px}
.tabs .pill{position:absolute;left:0;top:5px;height:38px;width:0;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 4px 14px -6px rgba(0,0,0,.5);transition:transform .6s var(--ease),width .6s var(--ease)}
.tabs button{position:relative;z-index:1;height:38px;padding:0 22px;border-radius:999px;font-weight:500;font-size:14px;color:rgba(255,255,255,.72);white-space:nowrap;transition:color .3s}
.tabs button.on{color:#111}

/* rail */
.rail{position:fixed;left:max(18px,1.8vw);top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:10px;padding:8px;border-radius:999px}
.rail button{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.82);transition:background .3s,color .3s}
.rail button:hover{background:rgba(255,255,255,.14)}
.rail button.on{background:rgba(255,255,255,.94);color:#111}
.rail svg{width:20px;height:20px}

/* stage + cards */
.stage{position:fixed;inset:0;z-index:10;touch-action:none}
.arc{position:absolute;left:50%;top:50%;width:0;height:0}
.card{position:absolute;left:calc(var(--CW)/-2);top:calc(var(--CW)*-.71);width:var(--CW);height:calc(var(--CW)*1.42);border-radius:22px;overflow:hidden;will-change:transform,opacity}
.card .g{position:absolute;left:8%;right:8%;top:5%;height:66%;display:flex;justify-content:center;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}
.gi{flex:none;height:100%;aspect-ratio:1;background-image:var(--garm);background-repeat:no-repeat;background-size:320% 212.5%}
.card .nm{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-weight:500;font-size:calc(var(--CW)*.068);text-shadow:0 1px 8px rgba(0,0,0,.3)}
.card .pr{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-weight:700;font-size:calc(var(--CW)*.095);text-shadow:0 1px 8px rgba(0,0,0,.3)}
.sheen{position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%)}
.card:hover .sheen{animation:sheen 1s}
@keyframes sheen{to{transform:translateX(120%)}}

/* arrows */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:30;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.arrow svg{width:16px;height:16px}
.arrow.l{left:calc(max(18px,1.8vw) + 76px)}
.arrow.r{right:max(18px,1.8vw)}

/* whatsapp */
.wa{position:fixed;right:max(18px,1.8vw);top:calc(50% + 40px);z-index:30;display:flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 12px;border-radius:999px;text-decoration:none;color:#fff;font-weight:600;font-size:13px;letter-spacing:.01em;transition:background .3s}
.wa:hover{background:rgba(255,255,255,.14)}
.wa svg{width:24px;height:24px;color:#25D366;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}

/* rail badge */
.badge{position:absolute;top:1px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#fff;color:#111;font-style:normal;font-weight:700;font-size:10px;line-height:17px;text-align:center;box-shadow:0 2px 8px -2px rgba(0,0,0,.5);transform:scale(0);transition:transform .35s var(--ease);pointer-events:none}
.badge.show{transform:scale(1)}

/* side panels */
.panel{position:fixed;left:calc(max(18px,1.8vw) + 76px);top:50%;width:min(340px,100vw - 120px);max-height:calc(var(--vh)*62);overflow-y:auto;scrollbar-width:none;z-index:65;border-radius:24px;padding:18px;color:#fff;
  opacity:0;pointer-events:none;transform:translateY(-50%) translateX(-14px) scale(.97);transition:opacity .45s var(--ease),transform .55s var(--ease)}
.panel.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.panel::-webkit-scrollbar{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.pt{font-weight:700;font-size:18px}
.ps{font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.ps.ok{margin-top:10px;text-align:center;min-height:1.2em}
.lab2{font-weight:500;font-size:12px;opacity:.85;margin:12px 0 8px}
.empty{font-weight:500;font-size:14px;line-height:1.5;opacity:.9;padding:18px 0 8px;text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:16px;background:rgba(255,255,255,.08)}
.row .th{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.12);padding:4px}
.row .th .gi{width:100%;height:100%;aspect-ratio:auto}
.rm b{display:block;font-weight:600;font-size:14px}
.rm span{display:block;font-weight:500;font-size:12px;opacity:.85;margin:1px 0 6px}
.qt{display:flex;align-items:center;gap:8px}
.qt em{font-style:normal;font-weight:600;font-size:13px;min-width:14px;text-align:center}
.q{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:600;font-size:14px;line-height:1;transition:transform .25s var(--ease),background .3s}
.q:hover{background:rgba(255,255,255,.3)}
.q:active{transform:scale(.9)}
.rp{font-weight:700;font-size:14px;align-self:start;padding-top:2px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 12px;font-weight:600;font-size:15px}
.tot b{font-weight:800;font-size:18px}
.pbtn{width:100%;height:44px;border-radius:999px;background:#fff;color:#111;font-weight:600;font-size:14px;box-shadow:0 4px 14px -6px rgba(0,0,0,.5);margin-top:16px;transition:transform .25s var(--ease),opacity .3s}
.tot+.pbtn{margin-top:0}
.pbtn:hover{opacity:.92}
.pbtn:active{transform:scale(.97)}
.drow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.drow::-webkit-scrollbar{display:none}
.dch{flex:none;width:50px;height:60px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .3s,color .3s,transform .25s var(--ease)}
.dch span{font-weight:500;font-size:11px;opacity:.9}
.dch b{font-weight:700;font-size:17px}
.dch.on{background:#fff;color:#111}
.trow{display:flex;flex-wrap:wrap;gap:8px}
.tch{height:34px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:13px;transition:background .3s,color .3s,transform .25s var(--ease)}
.tch.on{background:#fff;color:#111}
.dch:active,.tch:active{transform:scale(.95)}
.avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-weight:700;font-size:22px;margin:4px 0 14px}
.avatar svg{width:26px;height:26px}
.panel input,.mbox input{width:100%;height:44px;border-radius:14px;padding:0 14px;margin-bottom:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:500;font-size:14px;outline:none;transition:border-color .3s,background .3s}
.panel input::placeholder,.mbox input::placeholder{color:rgba(255,255,255,.6)}
.panel input:focus,.mbox input:focus{border-color:#fff;background:rgba(255,255,255,.18)}

/* currency switch */
.fx{position:fixed;right:max(18px,1.8vw);top:calc(var(--vh)*4.2);z-index:30;display:flex;gap:2px;padding:5px;border-radius:999px}
.fx button{height:38px;padding:0 15px;border-radius:999px;font-weight:600;font-size:13px;color:rgba(255,255,255,.72);transition:background .4s var(--ease),color .3s}
.fx button.on{background:rgba(255,255,255,.94);color:#111;box-shadow:0 4px 14px -6px rgba(0,0,0,.5)}

/* language switch */
.lang{position:fixed;left:max(18px,1.8vw);top:calc(var(--vh)*4.2);z-index:30;display:flex;gap:2px;padding:5px;border-radius:999px}
.lang button{height:38px;padding:0 15px;border-radius:999px;font-weight:600;font-size:13px;color:rgba(255,255,255,.72);transition:background .4s var(--ease),color .3s}
.lang button.on{background:rgba(255,255,255,.94);color:#111;box-shadow:0 4px 14px -6px rgba(0,0,0,.5)}
.panel .chips,.qt,.mbox input[type=number]{direction:ltr}

/* wardrobe intro (light: no heavy animation) */
body.intro .tabs,body.intro .rail,body.intro .arrow,body.intro .wa,body.intro .fx,body.intro .lang{opacity:0;visibility:hidden;pointer-events:none}
body.intro .buy{opacity:0!important;visibility:hidden;pointer-events:none!important}
body.intro .room i,body.intro .room .sweep{animation-play-state:paused}
.tabs,.rail,.arrow,.fx,.lang{transition:opacity .7s var(--ease)}
.wa{transition:background .3s,opacity .7s var(--ease)}
.stage{cursor:grab}
.card{cursor:pointer}
.intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;cursor:pointer;outline:none;transition:opacity .45s ease}
.intro.leave{opacity:0;pointer-events:none}
.wd-zoom{display:contents}
.wd{--wW:min(66vw,calc(var(--vh)*40));position:relative;width:var(--wW);height:calc(var(--wW)*1.5);margin-top:-4vh;animation:wdIn .7s ease backwards}
@keyframes wdIn{from{opacity:0}}
.wd-float{position:absolute;inset:0}
.wd-aura{position:absolute;inset:-14% -34%;background:radial-gradient(closest-side,rgba(255,196,128,.22),transparent 72%)}
.wd-shadow{position:absolute;left:6%;right:6%;bottom:-2.5%;height:5%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%)}
.wd-cornice{position:absolute;left:-3.5%;right:-3.5%;top:0;height:5.5%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#383c4a,#171a22);box-shadow:0 6px 14px -6px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.3);display:grid;place-items:center}
.wd-cornice span{font-weight:800;font-size:calc(var(--wW)*.055);letter-spacing:.3em;padding-left:.3em;line-height:1;color:#e6c98f;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.wd-case{position:absolute;left:0;right:0;top:5%;bottom:4.5%;border-radius:8px;background:linear-gradient(160deg,#323644,#121419);box-shadow:0 30px 50px -28px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.05)}
.wd-plinth{position:absolute;left:1.5%;right:1.5%;bottom:0;height:5%;border-radius:3px 3px 8px 8px;background:linear-gradient(180deg,#282c37,#0e1015)}
.wd-in{position:absolute;inset:2.4% 3.5%;border-radius:4px;overflow:hidden;background:linear-gradient(180deg,#241a12,#0d0907);box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.wd-in::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 65% at 50% 0%,rgba(255,208,142,.5),rgba(255,208,142,.12) 55%,transparent 78%)}
.wd-in .rail{position:absolute;left:0;right:0;height:1.1%;background:linear-gradient(180deg,#e9cf98,#8a6a38)}
.rk{position:absolute;width:38%}
.rk .hk{display:block;width:40%;height:auto;margin:0 auto;position:relative;z-index:1}
.rk .gi{width:100%;height:auto;aspect-ratio:1;margin-top:-13%}
.door{position:absolute;top:2.4%;bottom:2.4%;width:calc(50% - 3.8%);border-radius:5px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 46%,rgba(190,210,255,.13));box-shadow:inset 0 0 0 1px rgba(255,255,255,.32),inset 0 1px 0 rgba(255,255,255,.5),0 0 0 2px rgba(10,12,18,.85)}
.door.l{left:3.5%}
.door.r{right:3.5%}
.door::before{content:"";position:absolute;inset:4% 9%;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
.door::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.14) 49%,transparent 62%)}
.knob{position:absolute;top:44%;width:calc(var(--wW)*.018);height:calc(var(--wW)*.12);border-radius:99px;background:linear-gradient(90deg,#8a6732,#f2d99c 46%,#9a7540);box-shadow:0 2px 6px rgba(0,0,0,.55)}
.door.l .knob{right:9%}
.door.r .knob{left:9%}

/* light mode (weak devices): no blur, no ambient animation */
body.lite .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(155deg,rgba(44,48,66,.8),rgba(22,24,34,.84))}
body.lite .room i,body.lite .room .sweep{animation:none}
body.lite .room .grain{display:none}
body.lite .card .g{filter:none}

/* admin modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.modal.open{opacity:1;pointer-events:auto}
.mbox{width:min(520px,100vw - 28px);max-height:calc(var(--vh)*84);overflow-y:auto;scrollbar-width:none;padding:20px;border-radius:26px;color:#fff;transform:translateY(12px) scale(.98);transition:transform .5s var(--ease);background:linear-gradient(155deg,rgba(40,42,56,.92),rgba(20,21,30,.94))}
.mbox::-webkit-scrollbar{display:none}
.modal.open .mbox{transform:none}
.arow{display:grid;grid-template-columns:48px 1fr 28px;gap:10px;align-items:center;padding:8px;border-radius:16px;background:rgba(255,255,255,.08)}
.arow .th{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.12);padding:4px}
.arow .th .gi{width:100%;height:100%;aspect-ratio:auto}
.af input{height:38px;margin-bottom:8px;font-size:13px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.af .pgrid{margin-bottom:0}
.pi{position:relative}
.pi span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;font-size:11px;opacity:.85;pointer-events:none}
.pi input{padding-left:44px;margin-bottom:0}
.af .pi input{height:38px;font-size:13px}
.ps.err{margin-top:10px;text-align:center;min-height:1.2em;font-weight:600;opacity:1}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.sbtn{height:40px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13px;transition:background .3s,transform .25s var(--ease)}
.sbtn:hover{background:rgba(255,255,255,.28)}
.sbtn:active{transform:scale(.96)}
.sbtn.full{width:100%;height:42px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.sbtn.sm{height:34px;padding:0 14px;font-size:12px}
.sbtn svg{width:16px;height:16px;flex:none}
.empty-note{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:20;padding:14px 22px;border-radius:999px;font-weight:600;font-size:14px;color:#fff;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.empty-note.show{opacity:1}

/* admin: category + image controls */
.arow .afit{grid-column:1/-1;display:grid;gap:8px;padding-top:2px}
.sel{display:flex;align-items:center;gap:8px}
.sel span{font-weight:600;font-size:11px;opacity:.85;min-width:62px}
.mbox select{flex:1;min-width:0;height:38px;border-radius:12px;padding:0 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;font:inherit;font-weight:600;font-size:13px;outline:none}
.mbox select option{color:#111}
.upl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.upl .sbtn{flex:none}
.upl small{font-weight:500;font-size:12px;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buy{transition:opacity .3s var(--ease)}
.buy.hide{opacity:0;pointer-events:none}

/* buy card */
.buy{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--vh)*4.6);z-index:60;width:min(640px,100vw - 32px);display:flex;align-items:center;gap:22px;padding:12px 22px 12px 12px;border-radius:24px;color:#fff}
.thumb{flex:none;width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.12);padding:6px;overflow:hidden}
.thumb .gi{width:100%;height:100%;aspect-ratio:auto}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ln{display:grid;height:1.15em;line-height:1.15;overflow:hidden}
.ln>span{grid-area:1/1;white-space:nowrap}
.nmL{font-weight:600;font-size:16px}
.prL{font-weight:500;font-size:14px;opacity:.9}
.grp{display:flex;flex-direction:column;gap:7px}
.lab{font-weight:500;font-size:12px;opacity:.85}
.chips,.dots{display:flex;gap:6px;align-items:center}
.chip{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:12px;display:grid;place-items:center;transition:transform .25s var(--ease),background .3s,color .3s}
.chip:active{transform:scale(.9)}
.chip.on{background:#fff;color:#111}
.dots{gap:8px;height:30px}
.dot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.3);transition:box-shadow .3s}
.dot.on{box-shadow:0 0 0 2px rgba(10,11,16,.9),0 0 0 4px rgba(255,255,255,.95)}
.grp .ln.lab{height:1.15em}

/* add to cart */
.add{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 4px 14px -6px rgba(0,0,0,.5);transition:transform .25s var(--ease)}
.add svg{width:18px;height:18px}
.add:active{transform:scale(.9)}

@media (max-width:1000px){
  .fx,.lang{top:calc(calc(var(--vh)*4.2) + 58px)}
}
@media (max-width:767px){
  :root{--MH:min(calc(var(--vh)*62),128vw)}
  .glass{backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3)}
  .tabs{max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}

  .tabs button{height:32px;padding:0 13px;font-size:12px}
  .tabs .pill{height:32px}
  .rail{top:calc(var(--vh)*4.2 + 52px);bottom:auto;left:10px;transform:none;flex-direction:row;gap:6px;padding:6px}
  .rail button{width:34px;height:34px}
  .rail svg{width:18px;height:18px}
  .fx{top:calc(var(--vh)*4.2 + 52px);right:10px}
  .fx button{height:32px;padding:0 12px;font-size:12px}
  .lang{top:calc(var(--vh)*4.2 + 104px);left:auto;right:10px}
  .lang button{height:32px;padding:0 12px;font-size:12px}
  .arrow{display:none}
  .wa{top:auto;right:10px;bottom:calc(var(--vh)*2.5 + 162px);width:44px;height:44px;padding:0;justify-content:center}
  .wa span{display:none}
  .panel{top:calc(var(--vh)*4.2 + 108px);bottom:auto;left:10px;right:10px;width:auto;max-height:calc(var(--vh)*56);transform:translateY(-10px) scale(.97)}

/* pick an image from the device, shrink it, return a data URL (keeps transparency) */
function pickImage(cb){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];
    if(!f)return;
    const url=URL.createObjectURL(f);
    const im=new Image();
    im.onload=()=>{
      const MAX=640,sc=Math.min(1,MAX/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      let d=c.toDataURL("image/webp",.86);
      if(d.indexOf("data:image/webp")!==0)d=c.toDataURL("image/png");
      URL.revokeObjectURL(url);
      cb(d,f.name);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);say("aErr",tr("img_err"))};
    im.src=url;
  };
  inp.click();
}

const lnName=$("lnName"),lnPrice=$("lnPrice"),lnColor=$("lnColor"),dots=$("dots"),thumbG=$("thumbG");
function roll(el,text,animate){
  const last=el.lastElementChild;
  if(last&&last.textContent===text)return;
  const n=document.createElement("span");
  n.textContent=text;
  el.appendChild(n);
  const olds=[...el.children].filter(s=>s!==n);
  if(!animate||reduced){olds.forEach(s=>s.remove());return}
  const o={duration:620,easing:EASE,fill:"both"};
  n.animate([{transform:"translateY(110%)"},{transform:"translateY(0)"}],o);
  olds.forEach(s=>{s.animate([{transform:"translateY(0)"},{transform:"translateY(-110%)"}],o).onfinish=()=>s.remove()});
}
let selColor=0;
function setBuy(idx,animate){
  const it=VIEW[idx]||VIEW[0];
  if(!it)return;
  roll(lnName,it.n,animate);
  roll(lnPrice,fmt(it),animate);
  roll(lnColor,tr("color")+" · "+colorName(it.c[0][0]),animate);
  setGi(thumbG,it);
  if(animate&&!reduced)thumbG.animate([{transform:"translateY(70%) scale(.8)"},{transform:"none"}],{duration:650,easing:EASE});
  selColor=0;dots.innerHTML="";
  it.c.forEach((c,k)=>{
    const d=document.createElement("button");
    d.className="dot"+(k===0?" on":"");
    d.style.background=c[1];
    d.setAttribute("aria-label",colorName(c[0]));
    d.addEventListener("click",()=>{
      selColor=k;
      dots.querySelectorAll(".dot").forEach(x=>x.classList.toggle("on",x===d));
      roll(lnColor,tr("color")+" · "+colorName(c[0]),true);
    });
    dots.appendChild(d);
  });
}

/* ---------- cloud (Firebase REST) ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function fbSignIn(email,password){
  const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(FB.apiKey),{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:password,returnSecureToken:true})
  });
  const d=await r.json();
  if(!r.ok)throw new Error((d.error&&d.error.message)||"AUTH");
  fbAuth={idToken:d.idToken,refreshToken:d.refreshToken,exp:Date.now()+(Number(d.expiresIn)-60)*1000};
  try{sessionStorage.setItem("vf_rt",d.refreshToken)}catch(e){}
}
async function fbToken(){
  if(!fbAuth){
    let rt=null;try{rt=sessionStorage.getItem("vf_rt")}catch(e){}
    if(!rt)throw new Error("LOGIN");
    fbAuth={idToken:"",refreshToken:rt,exp:0};
  }
  if(Date.now()>=fbAuth.exp){
    const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(FB.apiKey),{
      method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(fbAuth.refreshToken)
    });
    const d=await r.json();
    if(!r.ok)throw new Error("LOGIN");
    fbAuth={idToken:d.id_token,refreshToken:d.refresh_token,exp:Date.now()+(Number(d.expires_in)-60)*1000};
    try{sessionStorage.setItem("vf_rt",d.refresh_token)}catch(e){}
  }
  return fbAuth.idToken;
}
async function cloudSave(){
  const tok=await fbToken();
  const body=JSON.stringify(JSON.stringify(PRODUCTS));
  const r=await fetch(DB+"/store/products.json?auth="+encodeURIComponent(tok),{method:"PUT",headers:{"Content-Type":"application/json"},body:body});
  if(!r.ok)throw new Error("SAVE "+r.status);
  lastRemote=JSON.stringify(PRODUCTS);
}
let saveTimer=0,lastRemote=null;
function cloudPush(){
  if(!cloudOn)return;
  say("aOk",tr("saving"));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await cloudSave();say("aErr","");say("aOk",tr("saved_cloud"))}
    catch(e){
      const m=String(e.message);
      if(m==="LOGIN"){setAdmin(false);say("aErr",tr("session_exp"))}
      else if(/SAVE 40[13]/.test(m))say("aErr",tr("perm"));
      else say("aErr",tr("save_fail"));
    }
  },400);
}
async function cloudLoad(){
  const r=await fetch(DB+"/store/products.json",{cache:"no-store"});
  if(!r.ok)throw new Error("LOAD");
  return await r.json();
}
function applyRemote(list){
  PRODUCTS=list;
  persistProducts();
  pruneCart();

async function syncFromCloud(){
  if(!cloudOn)return;
  try{
    const v=await cloudLoad();
    if(v==null){
      if(adminOn){try{await cloudSave()}catch(e){}}
      return;
    }
    if(typeof v!=="string"||v===lastRemote)return;
    lastRemote=v;
    if(v===JSON.stringify(PRODUCTS))return;
    if(dragging||down||(modalOpen()&&adminOn))return;
    const list=JSON.parse(v);
    if(Array.isArray(list)&&list.length&&list.every(validProduct))applyRemote(list);
  }catch(e){}
}

  return out.length?out:clone(DEFAULT_COLORS);
}

/* ---------- state ---------- */
let started=false,pos=0,target=0,intro=0,ie=0;
let shown=-1,shownOnce=false;
let dragging=false,down=null;
let px=0,py=0,sx=0,sy=0;
let t=0,lastT=0,fpsN=0,fpsC=0,fpsSum=0;

function select(idx){
  setBuy(idx,shownOnce);
  shownOnce=true;
}

function frame(ts){
  t=ts/1000;const dt=Math.min(.05,t-(lastT||t));lastT=t;const k60=dt*60;
  const sm=1-Math.pow(.94,k60);sx+=(px-sx)*sm;sy+=(py-sy)*sm;
  if(!dragging)pos+=(target-pos)*(1-Math.pow(.89,k60));
  if(started){intro=Math.min(1,intro+.012*k60);}
  ie=1-Math.pow(1-intro,3);

  const half=N/2;
  for(let i=0;i<cards.length;i++){
    const u=loop?mod(i-pos+half,N)-half:i-pos,a=Math.abs(u),sg=Math.sign(u);
    let s,z,op=1,ry,blur=0;
    const x=sg*xAt(a)*ie;
    if(a<1){
      s=1+.15*(1-a);z=0;op=1;ry=-sg*16*a;
    }else{
      s=1/(1+.3*Math.pow(a-1,1.15));z=-110*(a-1);
      ry=-sg*(16+9*Math.min(2,a-1));
      blur=lite?0:Math.round(Math.max(0,a-1.6)*2.4*2)/2;
    }
    if(a>3.4)op=Math.max(0,Math.min(1,1-(a-3.4)/.8));
    const bob=reduced?0:Math.sin(t*1.1+cards[i].seed)*H*.006*Math.min(1,a);
    const y=bob-(1-s)*H*.04;
    ry+=sx*10;
    const o=op*ie,el=cards[i].el;
    el.style.opacity=o;
    el.style.visibility=o<.01?"hidden":"visible";
    el.style.zIndex=Math.round(100-10*a);
    el.style.filter=blur>.05?"blur("+blur.toFixed(2)+"px)":"";
    el.style.transform="translate("+x.toFixed(2)+"px,"+y.toFixed(2)+"px) perspective(1300px) translateZ("+z.toFixed(2)+"px) rotateY("+ry.toFixed(2)+"deg) rotateX("+(-sy*6).toFixed(2)+"deg) scale("+(s*(.6+.4*ie)).toFixed(4)+")";
  }

  room.style.transform="translate3d("+(-sx*22)+"px,"+(-sy*14)+"px,0) scale("+(1.08-.03*ie)+")";
  ghost.style.transform="translate(calc(-50% - "+(sx*40)+"px),"+(-sy*16)+"px)";
  ghostLetters.forEach((l,i)=>{
    l.style.transform="translateY("+((1-ie)*(60+30*i))+"px)";
    l.style.opacity=ie;
  });

  if(started&&!lite&&fpsC<90){
    fpsN++;
    if(fpsN>15){fpsC++;fpsSum+=dt;if(fpsC===90&&fpsSum/90>.034)setLite(true,true)}
  }

  if(K>0&&!dragging&&Math.abs(target-pos)<.02){
    const idx=loop?mod(Math.round(target),K):Math.max(0,Math.min(K-1,Math.round(target)));
    if(idx!==shown){shown=idx;select(idx)}
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove",e=>{
  px=e.clientX/W-.5;py=e.clientY/H-.5;
  if(down&&e.pointerId===down.id){
    const dx=e.clientX-down.x;
    if(Math.abs(dx)>=(down.type==="mouse"?8:6))down.moved=true;
    if(down.moved){
      dragging=true;
      const raw=down.p0-dx/(XS()[1]*W);
      pos=(loop||K<1)?raw:Math.max(-.3,Math.min(K-1+.3,raw));
      const now=performance.now(),dt=Math.max(1,now-down.lt);
      const inst=(e.clientX-down.lx)/dt;
      down.v=down.v*.7+inst*.3;
      down.lx=e.clientX;down.lt=now;
    }
  }
});
addEventListener("pointerdown",e=>{
  if(!e.target.closest(".stage"))return;
  down={id:e.pointerId,type:e.pointerType,x:e.clientX,p0:pos,moved:false,v:0,lx:e.clientX,lt:performance.now(),card:e.target.closest(".card")};
});
function release(e){
  if(!down||e.pointerId!==down.id)return;
  const d=down;down=null;
  if(d.moved){
    const idle=performance.now()-d.lt;
    let flick=idle>80?0:d.v;
    flick=Math.max(-1.8,Math.min(1.8,flick));
    target=fixT(Math.round(pos-flick*3.2));
    dragging=false;
  }else{
    dragging=false;
    if(d.card){
      const i=+d.card.dataset.i;
      const u=loop?mod(i-pos+N/2,N)-N/2:i-pos;
      target=fixT(Math.round(pos+u));
    }
  }
}
addEventListener("pointerup",release);
addEventListener("pointercancel",release);

addEventListener("wheel",e=>{

  wAcc+=d;
  const now=performance.now();
  if(Math.abs(wAcc)>40&&now-wLast>200){
    go(wAcc>0?1:-1);
    wAcc=0;wLast=now;
